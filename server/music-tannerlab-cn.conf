# 80 端口：提供 ACME 证书校验并重定向到 HTTPS
server {
    listen 80;
    server_name music.tannerlab.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：HTTPS 反向代理与静态媒体 Range 直出
server {
    listen 443 ssl;
    server_name music.tannerlab.cn;

    ssl_certificate     /etc/letsencrypt/live/music.tannerlab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.tannerlab.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 客户端上传歌曲限制（最大允许 100M）
    client_max_body_size 100M;

    # 1. 媒体资源直出（Nginx 原生极速 Range 206 分片响应，适配 iOS Safari 与微信）
    location /media/ {
        alias /opt/lx-music-share/data/media/;
        expires 7d;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 2. 动态 API 与单页路由反代到 FastAPI
    location / {
        proxy_pass http://127.0.0.1:8920;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
